services:
  postgres:
    image: postgres:16
    container_name: izvor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - izvor-pgdata:/var/lib/postgresql/data
      - ./db/docker-init/init-izvor.sh:/docker-entrypoint-initdb.d/init-izvor.sh:ro
      - ./db/clean:/opt/izvor/db-clean:ro
    networks:
      - izvor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: izvor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=izvor;Username=izvor_app;Password=${IZVOR_DB_PASSWORD};Include Error Detail=true"
      Jwt__SecretKey: ${JWT_SECRET}
      TenantHost__BaseDomain: izvor.lvh.me
      BehindProxy: "true"
      TrustedProxies__0: ${TRUSTED_PROXY}
    networks:
      - izvor-net

  web:
    build: ./web/izvor-web
    container_name: izvor-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - izvor-net

  proxy:
    image: nginx:alpine
    container_name: izvor-proxy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    networks:
      izvor-net:
        ipv4_address: 172.28.0.10
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  izvor-net:
    name: izvor-net
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  izvor-pgdata:
    name: izvor-pgdata
